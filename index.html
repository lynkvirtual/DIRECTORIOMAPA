:root{--bg:#050b1a;--card:rgba(13,28,58,.8);--tx:#e8f1ff;--mu:#8fa8d0;--ac:#ff2a3a;--bl:#38bdf8;--bd:rgba(70,150,255,.3);--map:#0a1a3a;--st:rgba(30,60,120,.55);--wa:#1faa59;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body.fix #app{height:100dvh;display:flex;flex-direction:column}a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--bd)}.brand{display:flex;align-items:center;gap:10px}.logo{background:#fff;border-radius:10px;padding:2px 8px;display:flex}.logo img{height:34px}
.tg{font-weight:700;font-size:14px}.tg b{color:var(--ac)}.adm,.mu{color:var(--mu);font-size:13px}
.bar{padding:10px 14px;display:grid;gap:8px;border-bottom:1px solid var(--bd)}input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.chip,.tabs button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.chip.on,.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;align-items:center}.row select{flex:1}.row label{font-size:13px;white-space:nowrap;display:flex;gap:5px;align-items:center}.row label input{width:auto}.tabs{display:flex;gap:4px}
.pub{flex:1;min-height:0;display:grid;grid-template-columns:400px 1fr;grid-template-rows:minmax(0,1fr)}.lst{overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}.mp{position:relative;min-height:320px;height:100%}
@media(max-width:899px){.pub{grid-template-columns:1fr}.v-mapa .lst,.v-lista .mp{display:none}}@media(min-width:900px){.tabs{display:none}}
.bc{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}.bc.hl{border-color:#f5b53b;box-shadow:0 0 0 1px #f5b53b55}
.ph{height:110px;background:linear-gradient(135deg,#2a3140,#3b1318) center/cover;position:relative}.bi{padding:12px;display:grid;gap:6px}.bi h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--ac) center/cover;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;border:2px solid var(--card)}
.meta{color:var(--mu);font-size:13px}.star{color:#f5b53b;font-size:12px;font-weight:700}.ok{color:#33c46b}.no{color:#e5575f}
.ac{display:flex;gap:6px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}.btn.s{background:var(--st);color:var(--tx);border:1px solid var(--bd)}.btn.w{background:var(--wa)}.btn.sm{padding:6px 10px;font-size:13px}
svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--map)}.mk{cursor:pointer}.mk path{fill:var(--ac);stroke:#fff;stroke-width:2}.mk.on path{fill:var(--bl)}.mk.hl path{stroke:#f5b53b;stroke-width:3}
.zm{position:absolute;right:10px;top:10px;display:grid;gap:6px}.zm button{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px;cursor:pointer}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;max-width:440px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;display:grid;gap:8px;box-shadow:0 10px 30px #0008}
.card{max-width:560px;margin:0 auto;padding-bottom:30px}.card .ph{height:200px;border-radius:0 0 18px 18px}.card .head{display:flex;gap:12px;align-items:flex-end;margin:-34px 16px 0;position:relative}.card .av{width:72px;height:72px;font-size:28px}
.pad{padding:12px 16px;display:grid;gap:10px}.lk{display:grid;gap:8px}.lk a{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 16px;font-weight:600;display:flex;justify-content:space-between}.lk a.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.mini{height:200px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--bd)}footer{text-align:center;padding:12px;color:var(--mu);font-size:12px}footer img{height:22px;vertical-align:middle;background:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.wrap{max-width:1000px;margin:0 auto;padding:14px;display:grid;gap:14px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat b{font-size:26px;display:block}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th,.tb td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}.tbw{overflow-x:auto;background:var(--card);border-radius:12px;border:1px solid var(--bd)}.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--st)}.tag.activo{background:#1c4a2e;color:#6ee79d}.tag.borrador{background:#4a3a14;color:#f5c04b}
.lg-box{max-width:340px;margin:12vh auto;padding:20px;display:grid;gap:10px;text-align:center}.lg-box .logo{justify-self:center}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:start center;overflow:auto;z-index:9;padding:14px}.mf{background:var(--bg);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:640px;padding:16px;display:grid;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mf label{font-size:12px;color:var(--mu);display:grid;gap:3px}.pk{height:220px;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.sheet[hidden]{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;font-size:14px}.ln{stroke:var(--st);fill:none}
.lf{position:absolute;inset:0;z-index:0}.leaflet-container{background:var(--map);font:inherit}.sheet{z-index:1000}.pad,.lk,.lst{grid-auto-rows:max-content}.lk a{align-items:center}
body{background:radial-gradient(900px 500px at 15% -10%,#0f3a7a77,transparent),#050b1a}
.top{background:rgba(5,11,26,.88);backdrop-filter:blur(10px);gap:10px;flex-wrap:wrap}.logo{box-shadow:0 0 18px #38bdf866}.city{display:flex;gap:6px;overflow-x:auto;flex:1;justify-content:center}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:14px;backdrop-filter:blur(10px);box-shadow:0 0 22px #0b3a8a33}
.leaflet-tile-pane{filter:invert(1) sepia(1) hue-rotate(185deg) saturate(2.4) brightness(2.2)}.leaflet-container{background:#0a1a3a}
.bub{position:absolute;transform:translate(-50%,calc(-100% - 9px));white-space:nowrap;background:linear-gradient(135deg,#1d6fe0,#1553b8);border:1px solid #7cc4ff;color:#fff;border-radius:12px;padding:5px 10px;font:600 12px system-ui;box-shadow:0 0 14px #38bdf8aa;display:flex;gap:8px;align-items:center}
.bub i{font-style:normal;color:#ffd15a}.bub:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:#1553b8;border-bottom:0}.bub.hl{border-color:#f5b53b}
.bub.on{background:linear-gradient(135deg,#ff2a3a,#b3121f);border-color:#fff;animation:bn 1s infinite}.bub.on:after{border-top-color:#ff2a3a;bottom:-13px;margin-left:-11px;border-width:13px 11px 0}@keyframes bn{50%{transform:translate(-50%,calc(-100% - 16px))}}
.bc{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px;cursor:pointer}.bc .th{width:96px;height:96px;border-radius:10px;background:#16305f center/cover;display:grid;place-items:center;font-size:34px;font-weight:800}.bc h3{margin:0 0 2px;font-size:16px}
.stars{color:#ffc542;letter-spacing:1px}.sheet{backdrop-filter:blur(10px)}
.yp{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:14px}@media(min-width:900px){.yp{grid-template-columns:1fr 360px}}.col{display:grid;gap:14px;align-content:start}
.gal{display:flex;gap:8px;overflow-x:auto;height:260px}.gal div{flex:0 0 min(78%,420px);background:#16305f center/cover;border-radius:14px}.gal .ph0{flex:1;display:grid;place-items:center;font-size:80px;font-weight:800;background:linear-gradient(135deg,#123a7a,#3b1318)}
.rv{border-top:1px solid var(--bd);padding:8px 0}.rf{display:grid;gap:8px;margin-top:10px}.sv button{background:none;border:0;font-size:28px;color:#41557a;cursor:pointer}.sv button.on{color:#ffc542}
.top .logo,.lg-box .logo{background:none;padding:0;box-shadow:none}.logo img{height:50px;filter:drop-shadow(0 0 8px #38bdf8aa)}.lg-box .logo img{height:90px}
#splash{position:fixed;inset:0;z-index:5000;background:radial-gradient(700px 500px at 50% 40%,#0f3a7acc,#050b1a);display:grid;place-items:center;transition:opacity .6s}#splash img{width:min(62vw,340px);animation:pl 1.3s infinite alternate}@keyframes pl{to{transform:scale(1.07);filter:drop-shadow(0 0 26px #ff2a3a99)}}
.wm{position:absolute;left:12px;bottom:12px;width:150px;z-index:500;pointer-events:none;filter:drop-shadow(0 0 10px #000c)}@media(max-width:600px){.wm{width:110px}}
.fab{position:fixed;left:14px;bottom:14px;z-index:1100;background:rgba(5,11,26,.88);border:1px solid var(--bd);border-radius:14px;padding:6px 12px;backdrop-filter:blur(8px);box-shadow:0 0 18px #38bdf855;display:flex;align-items:center;gap:8px}.fab img{height:36px}.fab:after{content:"Mapa y directorio";font-size:12px;color:var(--mu)}
footer{padding-bottom:70px}

const K='lynk_db_v2';let mem=null;

const save=()=>{if(SB)return;mem=DB;try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const slugify=(t,id)=>{let b=t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'negocio',s=b,i=2;while(DB.b.some(x=>x.slug===s&&x.id!==id))s=b+'-'+i++;return s};

async function revAdd(x){if(SB){const{error}=await SB.from('reviews').insert(x);if(error){toast('Error: '+error.message);throw error}return}x.id=Math.max(0,...DB.r.map(y=>y.id))+1;x.creado=now();DB.r.push(x);save()}
async function revSet(x,e){if(SB){const q=e==='del'?SB.from('reviews').delete().eq('id',x.id):SB.from('reviews').update({estado:e}).eq('id',x.id);const{error}=await q;if(error){toast('Error: '+error.message);throw error}}if(e==='del')DB.r=DB.r.filter(y=>y.id!==x.id);else x.estado=e;save()}

$('#out').onclick=async()=>{if(SB){await SB.auth.signOut();ses=false;await loadAll()}ses=false;try{sessionStorage.removeItem('ls')}catch(e){}admin()};$('#nw').onclick=()=>form();$$('[data-rv]').forEach(x=>x.onclick=async()=>{const q=DB.r.find(y=>y.id==x.dataset.id);try{await revSet(q,x.dataset.rv==='ok'?'aprobada':'del');admin()}catch(e){}});
$$('[data-t]').forEach(x=>x.onclick=()=>{tab=x.dataset.t;admin()});
$$('[data-a]').forEach(x=>x.onclick=async()=>{const b=B.find(y=>y.id==x.dataset.id),a=x.dataset.a;
if(a==='ed')return form(b);if(a==='vw'){location.hash=(b.estado==='activo'?'/negocio/':'/preview/')+b.slug;return}
if(a==='tg'){b.estado=b.estado==='activo'?'inactivo':'activo'}if(a==='ds')b.destacado=!b.destacado;

try{await dbSave(b)}catch(e){return}admin()});

function tbl(r,mini){return`<div class="tbw"><table class="tb"><tr><th>Negocio</th><th>Ciudad</th><th>Categoría</th><th>Estado</th><th>Dest.</th>${mini?'':'<th>Acciones</th>'}</tr>${r.map(b=>`<tr><td>${b.demo?'<span class="tag">demo</span> ':''}${esc(b.nombre)}</td><td>${esc(CITIES[b.ciudad]?CITIES[b.ciudad].n:'—')}</td><td>${esc(cn(b.categoria))}</td><td><span class="tag ${b.estado}">${b.estado}</span></td><td>${b.destacado?'★':'—'}</td>${mini?'':`<td class="ac">${[['ed','Editar'],['vw','Ver'],['tg',b.estado==='activo'?'Desactivar':'Activar'],['ds',b.destacado?'Quitar ★':'Destacar'],['dl','Eliminar']].map(a=>`<button class="btn s sm" data-a="${a[0]}" data-id="${b.id}">${a[1]}</button>`).join('')}</td>`}</tr>`).join('')}</table></div>`}
const shrink=(f,max=700)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL(max<=240?'image/png':'image/jpeg',.82))};i.src=fr.result};fr.readAsDataURL(f)});
function form(b){const e=!!b;b=b||{nombre:'',categoria:DB.c[0]?.id,desc_corta:'',descripcion:'',tel:'',wa:'',email:'',web:'',fb:'',ig:'',tk:'',menu:'',res:'',otro:'',dir:'',zona:'',lat:19.43,lng:-99.14,abre:'09:00',cierra:'20:00',estado:'activo',destacado:false,logo:'',foto:'',ciudad:F.ciudad,precio:null,galeria:[],cd:''};
const t={...b},m=document.createElement('div');m.className='modal';
const f=(k,l,ty='text')=>`<label>${l}<input name="${k}" type="${ty}"${ty==='number'?' step="any"':''} value="${esc(t[k])}"></label>`;
m.innerHTML=`<form class="mf"><h3 style="margin:0">${e?'Editar':'Nuevo'} negocio</h3>${f('nombre','Nombre *')}<label>Categoría<select name="categoria">${DB.c.map(c=>`<option value="${c.id}" ${c.id==t.categoria?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></label>${f('desc_corta','Descripción corta')}<label>Descripción<textarea name="descripcion" rows="3">${esc(t.descripcion)}</textarea></label>
<div class="g2"><label>Logo<input type="file" accept="image/*" data-im="logo"></label><label>Fotografía principal<input type="file" accept="image/*" data-im="foto"></label>${f('tel','Teléfono','tel')}${f('wa','WhatsApp (con lada, ej. 5215512345678)','tel')}${f('email','Email','email')}${f('web','Página web')}${f('fb','Facebook')}${f('ig','Instagram')}${f('tk','TikTok')}${f('menu','Menú (enlace)')}${f('res','Reservaciones (enlace)')}${f('otro','Otro enlace')}${f('dir','Dirección')}<label>Ciudad<select name="ciudad">${Object.entries(CITIES).map(([k,c])=>`<option value="${k}" ${t.ciudad===k?'selected':''}>${c.n}</option>`).join('')}</select></label><label>Precio<select name="precio"><option value="">—</option>${[1,2,3,4].map(n=>`<option value="${n}" ${t.precio==n?'selected':''}>${'$'.repeat(n)}</option>`).join('')}</select></label><label>Zona<input name="zona" list="zl" value="${esc(t.zona)}"><datalist id="zl">${[...new Set(DB.b.map(x=>x.zona))].map(z=>`<option>${esc(z)}</option>`).join('')}</datalist></label>${f('abre','Abre','time')}${f('cierra','Cierra','time')}</div><label>Días cerrado<span class="row">${['lun','mar','mie','jue','vie','sab','dom'].map(d=>`<label><input type="checkbox" name="cd" value="${d}" style="width:auto" ${(t.cd||'').split(',').includes(d)?'checked':''}>${d}</label>`).join('')}</span></label><label>Galería de fotos (varias)<input type="file" accept="image/*" multiple data-gal></label>
<label>Pega aquí las coordenadas de Google Maps (ej. 19.4326, -99.1332)<input id="gm" placeholder="19.4326, -99.1332"></label><label>O toca el mapa para colocar el marcador</label><div class="pk" id="pk"></div><div class="g2">${f('lat','Latitud','number')}${f('lng','Longitud','number')}</div>
<div class="g2"><label>Estado<select name="estado">${['borrador','activo','inactivo'].map(s=>`<option ${t.estado===s?'selected':''}>${s}</option>`).join('')}</select></label><label style="align-content:end"><span><input type="checkbox" name="destacado" style="width:auto" ${t.destacado?'checked':''}> Destacado</span></label></div>
<div class="ac"><button class="btn" type="submit">Guardar</button><button class="btn s" type="button" id="pv">Vista previa</button><button class="btn s" type="button" id="cl">Cancelar</button></div><div id="pvw"></div></form>`;
document.body.append(m);const fm=$('form',m),rd=()=>{const d=new FormData(fm);for(const[k,v]of d.entries())t[k]=v;t.cd=d.getAll('cd').join(',');t.precio=t.precio?+t.precio:null;t.destacado=fm.destacado.checked;t.categoria=+t.categoria;t.lat=+t.lat;t.lng=+t.lng;return t};
const pk=mkMap($('#pk',m),[t],{all:DB.b.filter(x=>x.id!==t.id).concat([t]),onPick:(la,ln)=>{t.lat=la;t.lng=ln;fm.lat.value=la;fm.lng.value=ln;fm.gm.value=la+', '+ln;pk.set([t],null)}});
fm.lat.onchange=fm.lng.onchange=()=>{rd();pk.set([t],null,'pan')};
fm.gm.oninput=()=>{const x=fm.gm.value.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);if(x){t.lat=+x[1];t.lng=+x[2];fm.lat.value=t.lat;fm.lng.value=t.lng;pk.set([t],null,'pan')}};
$$('[data-im]',m).forEach(i=>i.onchange=async()=>{try{if(i.files[0]){const d=await shrink(i.files[0],i.dataset.im==='logo'?240:800);t[i.dataset.im]=SB?await up(d,i.dataset.im):d;toast('Imagen lista')}}catch(e){}});
$('[data-gal]',m).onchange=async e=>{try{for(const f of [...e.target.files].slice(0,6)){const d=await shrink(f,900);t.galeria=(t.galeria||[]).concat(SB?await up(d,'galeria'):d)}toast('Galería lista')}catch(x){}};$('#cl',m).onclick=()=>m.remove();$('#pv',m).onclick=()=>{rd();t.slug=t.slug||slugify(t.nombre||'previa',t.id);$('#pvw',m).innerHTML=cardHTML(t);wireCard(t)};
fm.onsubmit=async ev=>{ev.preventDefault();rd();if(!t.nombre.trim())return toast('El nombre es obligatorio');
try{if(e){Object.assign(b,t);b.slug=slugify(b.nombre,b.id);await dbSave(b)}else{if(!SB){t.id=DB.nid++;t.creado=now();DB.b.push(t)}t.slug=slugify(t.nombre,t.id);await dbSave(t);if(SB)DB.b.push(t)}}catch(x){return}
m.remove();admin();toast('Guardado')}}

function route(){const p=(location.hash.slice(1)||'/').split('/');if(p[1]==='negocio'||p[1]==='preview')return cardPage(p[2],p[1]==='preview');if(p[1]==='admin')return admin();pub()}
async function loadAll(){if(!SB)return;const[c,b,v]=await Promise.all([SB.from('categories').select('*').order('id'),SB.from('businesses').select('*').order('creado',{ascending:false}),SB.from('reviews').select('*').order('creado',{ascending:false})]);if(c.error||b.error||v.error){toast('Error al cargar: '+(c.error||b.error||v.error).message);return}DB.c=c.data;DB.b=b.data;DB.r=v.data}
addEventListener('hashchange',route);
(async()=>{if(SB){app.innerHTML='<p class="mu" style="padding:30px;text-align:center">Cargando…</p>';const{data}=await SB.auth.getSession();ses=!!data.session;await loadAll()}route();setTimeout(()=>{const s=$('#splash');if(s){s.style.opacity=0;setTimeout(()=>s.remove(),600)}},1100)})();
