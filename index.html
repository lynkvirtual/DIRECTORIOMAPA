<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LYNK — Encuentra. Conecta. LYNK.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><style>
:root{--bg:#0d0f13;--card:#171a21;--tx:#eef0f4;--mu:#98a0ae;--ac:#e5202e;--bl:#4a9bff;--bd:#272b35;--map:#161a22;--st:#2a3140;--wa:#1faa59;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4f7;--card:#fff;--tx:#14171c;--mu:#667085;--bd:#e0e3ea;--map:#e8ecf2;--st:#fff;color-scheme:light}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body.fix #app{height:100dvh;display:flex;flex-direction:column}a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--bd)}.brand{display:flex;align-items:center;gap:10px}.logo{background:#fff;border-radius:10px;padding:2px 8px;display:flex}.logo img{height:34px}
.tg{font-weight:700;font-size:14px}.tg b{color:var(--ac)}.adm,.mu{color:var(--mu);font-size:13px}
.bar{padding:10px 14px;display:grid;gap:8px;border-bottom:1px solid var(--bd)}input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.chip,.tabs button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.chip.on,.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;align-items:center}.row select{flex:1}.row label{font-size:13px;white-space:nowrap;display:flex;gap:5px;align-items:center}.row label input{width:auto}.tabs{display:flex;gap:4px}
.pub{flex:1;min-height:0;display:grid;grid-template-columns:400px 1fr;grid-template-rows:minmax(0,1fr)}.lst{overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}.mp{position:relative;min-height:320px;height:100%}
@media(max-width:899px){.pub{grid-template-columns:1fr}.v-mapa .lst,.v-lista .mp{display:none}}@media(min-width:900px){.tabs{display:none}}
.bc{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}.bc.hl{border-color:#f5b53b;box-shadow:0 0 0 1px #f5b53b55}
.ph{height:110px;background:linear-gradient(135deg,#2a3140,#3b1318) center/cover;position:relative}.bi{padding:12px;display:grid;gap:6px}.bi h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--ac) center/cover;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;border:2px solid var(--card)}
.meta{color:var(--mu);font-size:13px}.star{color:#f5b53b;font-size:12px;font-weight:700}.ok{color:#33c46b}.no{color:#e5575f}
.ac{display:flex;gap:6px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}.btn.s{background:var(--st);color:var(--tx);border:1px solid var(--bd)}.btn.w{background:var(--wa)}.btn.sm{padding:6px 10px;font-size:13px}
svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--map)}.mk{cursor:pointer}.mk path{fill:var(--ac);stroke:#fff;stroke-width:2}.mk.on path{fill:var(--bl)}.mk.hl path{stroke:#f5b53b;stroke-width:3}
.zm{position:absolute;right:10px;top:10px;display:grid;gap:6px}.zm button{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px;cursor:pointer}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;max-width:440px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;display:grid;gap:8px;box-shadow:0 10px 30px #0008}
.card{max-width:560px;margin:0 auto;padding-bottom:30px}.card .ph{height:200px;border-radius:0 0 18px 18px}.card .head{display:flex;gap:12px;align-items:flex-end;margin:-34px 16px 0;position:relative}.card .av{width:72px;height:72px;font-size:28px}
.pad{padding:12px 16px;display:grid;gap:10px}.lk{display:grid;gap:8px}.lk a{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 16px;font-weight:600;display:flex;justify-content:space-between}.lk a.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.mini{height:200px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--bd)}footer{text-align:center;padding:12px;color:var(--mu);font-size:12px}footer img{height:22px;vertical-align:middle;background:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.wrap{max-width:1000px;margin:0 auto;padding:14px;display:grid;gap:14px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat b{font-size:26px;display:block}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th,.tb td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}.tbw{overflow-x:auto;background:var(--card);border-radius:12px;border:1px solid var(--bd)}.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--st)}.tag.activo{background:#1c4a2e;color:#6ee79d}.tag.borrador{background:#4a3a14;color:#f5c04b}
.lg-box{max-width:340px;margin:12vh auto;padding:20px;display:grid;gap:10px;text-align:center}.lg-box .logo{justify-self:center}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:start center;overflow:auto;z-index:9;padding:14px}.mf{background:var(--bg);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:640px;padding:16px;display:grid;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mf label{font-size:12px;color:var(--mu);display:grid;gap:3px}.pk{height:220px;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.sheet[hidden]{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;font-size:14px}.ln{stroke:var(--st);fill:none}
.lf{position:absolute;inset:0;z-index:0}.leaflet-container{background:var(--map);font:inherit}.sheet{z-index:1000}.pad,.lk,.lst{grid-auto-rows:max-content}.lk a{align-items:center}

const CFG={url:'',key:''};
const SB=(typeof supabase!=='undefined'&&CFG.url&&CFG.key)?supabase.createClient(CFG.url,CFG.key):null;
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const K='lynk_db_v1';let mem=null;
const load=()=>{try{const d=localStorage.getItem(K);if(d)return JSON.parse(d)}catch(e){}return mem};
const save=()=>{if(SB)return;mem=DB;try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const slugify=(t,id)=>{let b=t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'negocio',s=b,i=2;while(DB.b.some(x=>x.slug===s&&x.id!==id))s=b+'-'+i++;return s};
const now=()=>new Date().toISOString();
const cols=['nombre','slug','categoria','desc_corta','descripcion','tel','wa','email','web','fb','ig','tk','menu','res','otro','dir','zona','lat','lng','abre','cierra','estado','destacado','logo','foto'];
async function dbSave(b){if(!SB){b.actualizado=now();save();return b}const row=Object.fromEntries(cols.map(k=>[k,b[k]??null]));row.demo=!!b.demo;row.actualizado=now();const q=b.id?SB.from('businesses').update(row).eq('id',b.id):SB.from('businesses').insert(row);const{data,error}=await q.select().single();if(error){toast('Error: '+error.message);throw error}Object.assign(b,data);return b}
async function dbDel(b){if(SB){const{error}=await SB.from('businesses').delete().eq('id',b.id);if(error){toast('Error: '+error.message);throw error}}DB.b=DB.b.filter(y=>y.id!==b.id);save()}
async function catSave(c){if(!SB){if(!c.id)c.id=Math.max(0,...DB.c.map(x=>x.id))+1;save();return c}const{data,error}=await(c.id?SB.from('categories').update({nombre:c.nombre}).eq('id',c.id):SB.from('categories').insert({nombre:c.nombre})).select().single();if(error){toast('Error: '+error.message);throw error}Object.assign(c,data);return c}

<label>Pega aquí las coordenadas de Google Maps (ej. 19.4326, -99.1332)<input id="gm" placeholder="19.4326, -99.1332"></label><label>O toca el mapa para colocar el marcador</label><div class="pk" id="pk"></div><div class="g2">${f('lat','Latitud','number')}${f('lng','Longitud','number')}</div>
<div class="g2"><label>Estado<select name="estado">${['borrador','activo','inactivo'].map(s=>`<option ${t.estado===s?'selected':''}>${s}</option>`).join('')}</select></label><label style="align-content:end"><span><input type="checkbox" name="destacado" style="width:auto" ${t.destacado?'checked':''}> Destacado</span></label></div>
<div class="ac"><button class="btn" type="submit">Guardar</button><button class="btn s" type="button" id="pv">Vista previa</button><button class="btn s" type="button" id="cl">Cancelar</button></div><div id="pvw"></div></form>`;
document.body.append(m);const fm=$('form',m),rd=()=>{const d=new FormData(fm);for(const[k,v]of d.entries())t[k]=v;t.destacado=fm.destacado.checked;t.categoria=+t.categoria;t.lat=+t.lat;t.lng=+t.lng;return t};
const pk=mkMap($('#pk',m),[t],{all:DB.b.filter(x=>x.id!==t.id).concat([t]),onPick:(la,ln)=>{t.lat=la;t.lng=ln;fm.lat.value=la;fm.lng.value=ln;fm.gm.value=la+', '+ln;pk.set([t],null)}});
fm.lat.onchange=fm.lng.onchange=()=>{rd();pk.set([t],null,'pan')};
fm.gm.oninput=()=>{const x=fm.gm.value.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);if(x){t.lat=+x[1];t.lng=+x[2];fm.lat.value=t.lat;fm.lng.value=t.lng;pk.set([t],null,'pan')}};
$$('[data-im]',m).forEach(i=>i.onchange=async()=>{try{if(i.files[0]){const d=await shrink(i.files[0],i.dataset.im==='logo'?240:800);t[i.dataset.im]=SB?await up(d,i.dataset.im):d;toast('Imagen lista')}}catch(e){}});
$('#cl',m).onclick=()=>m.remove();$('#pv',m).onclick=()=>{rd();t.slug=t.slug||slugify(t.nombre||'previa',t.id);$('#pvw',m).innerHTML=cardHTML(t);wireCard(t)};
fm.onsubmit=async ev=>{ev.preventDefault();rd();if(!t.nombre.trim())return toast('El nombre es obligatorio');
try{if(e){Object.assign(b,t);b.slug=slugify(b.nombre,b.id);await dbSave(b)}else{if(!SB){t.id=DB.nid++;t.creado=now();DB.b.push(t)}t.slug=slugify(t.nombre,t.id);await dbSave(t);if(SB)DB.b.push(t)}}catch(x){return}
m.remove();admin();toast('Guardado')}}
/* ===== Rutas ===== */
function route(){const p=(location.hash.slice(1)||'/').split('/');if(p[1]==='negocio'||p[1]==='preview')return cardPage(p[2],p[1]==='preview');if(p[1]==='admin')return admin();pub()}
async function loadAll(){if(!SB)return;const[c,b]=await Promise.all([SB.from('categories').select('*').order('id'),SB.from('businesses').select('*').order('creado',{ascending:false})]);if(c.error||b.error){toast('Error al cargar: '+(c.error||b.error).message);return}DB.c=c.data;DB.b=b.data}
addEventListener('hashchange',route);
(async()=>{if(SB){app.innerHTML='<p class="mu" style="padding:30px;text-align:center">Cargando…</p>';const{data}=await SB.auth.getSession();ses=!!data.session;await loadAll()}route()})();
</script></body></html>
